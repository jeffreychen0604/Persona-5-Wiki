name: Seed local guide data

on:
  push:
    paths:
      - '.github/workflows/seed-local-data.yml'
      - 'scripts/sync_dialogue_prompts.py'
      - 'scripts/validate_dialogue_matching.mjs'
      - 'data/dialogue-overrides.js'
      - 'app.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seed-local-guide-data
  cancel-in-progress: false

jobs:
  seed-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download structured Confidant answer dataset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsSL \
            'https://raw.githubusercontent.com/olegbl/p5rcheatsheet/9769523572eb6b955cd1cb4b672e8fb9b9ce8b39/src/data/confidants.js' \
            -o data/confidants.js
          grep -q 'export const confidants' data/confidants.js

      - name: Build repository-local dialogue context
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_dialogue_prompts.py
          grep -q 'export const dialoguePrompts' data/dialogue-prompts.js
          test -s data/dialogue-prompts-report.json

      - name: Validate application syntax
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --check app.js
          node --experimental-default-type=module --check data/dialogue-overrides.js

      - name: Require complete prompt matching coverage
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module scripts/validate_dialogue_matching.mjs
          test -s data/dialogue-match-report.json
          grep -q '"effectiveCoverage": 100' data/dialogue-match-report.json
          grep -q '"positionalFallbacks": 0' data/dialogue-match-report.json
          grep -q '"missing": 0' data/dialogue-match-report.json

      - name: Remove temporary inspection data
        shell: bash
        run: |
          rm -f debug/ann-wikitext.txt
          rmdir debug 2>/dev/null || true

      - name: Commit repository-local guide data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository-local guide data is already current.'
          else
            git commit -m 'Validate complete Confidant dialogue context coverage'
            git push
          fi
