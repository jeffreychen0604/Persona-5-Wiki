<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="P5R Guide">
  <meta name="format-detection" content="telephone=no">
  <title>P5R Pocket Guide</title>
  <link rel="stylesheet" href="./styles.css?v=6">
  <link rel="stylesheet" href="./dialogue.css?v=6">
  <link rel="stylesheet" href="./quiz.css?v=6">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">P5R</span>
      <span><strong>P5R Pocket Guide</strong><small>Repository data edition</small></span>
    </div>
  </header>

  <section class="hero">
    <small>Persona 5 Royal</small>
    <h1 id="heroTitle">Confidant Guide</h1>
    <p id="heroText">Read each dialogue prompt before choosing the best response.</p>
    <div class="status"><i></i><span>Preloaded from this repository</span></div>
  </section>

  <section class="searchbar">
    <input id="searchInput" type="search" placeholder="Search dialogue, answer, ability or requirement…" autocomplete="off">
  </section>

  <nav id="filterChips" class="chips" aria-label="Guide filters"></nav>

  <main class="panel">
    <header class="panelHead">
      <span><strong id="panelTitle">Loading guide…</strong><small id="panelMeta">Local structured data</small></span>
      <a id="sourceLink" class="sourceLink" href="#" target="_blank" rel="noreferrer">Source ↗</a>
    </header>
    <nav id="rankJumps" class="rankJumps" aria-label="Rank shortcuts"></nav>
    <article id="content" class="content" aria-live="polite">
      <div class="loading">Preparing local guide data…</div>
    </article>
  </main>

  <button id="backTop" class="backTop" aria-label="Back to top">↑</button>

  <nav class="bottomNav" aria-label="Main sections">
    <button class="navButton active" data-view="confidants">♟ Confidants</button>
    <button class="navButton" data-view="class">✎ Class Answers</button>
    <button class="quizNavButton" id="quizNav" type="button">▣ TV Quiz</button>
  </nav>

  <noscript>This guide requires JavaScript, but all guide data is stored locally in the repository.</noscript>
  <script type="module" src="./app.js?v=6"></script>
  <script type="module" src="./quiz-tab.js?v=6"></script>
</body>
</html>
