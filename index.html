<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="P5R Guide">
<title>P5R Pocket Guide</title>
<style>
:root{--r:#e60012;--bg:#090909;--p:#171717;--p2:#202020;--tx:#f7f3eb;--mu:#aaa49a;--ln:#383838;--g:#ffd24a;--safe-b:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(135deg,#1b0005 0 12%,transparent 12%),repeating-linear-gradient(-12deg,transparent 0 34px,#ffffff05 34px 36px),var(--bg);color:var(--tx);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + var(--safe-b))}button,input{font:inherit}button{color:inherit}.top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#090909ee;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff18}.brand{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;display:grid;place-items:center;background:var(--r);font-weight:950;transform:rotate(-4deg);box-shadow:4px 4px #fff}.brand strong{display:block;text-transform:uppercase;letter-spacing:.06em}.brand small{color:var(--mu)}.hero{padding:20px 14px 12px}.hero small{color:#ff6d79;font-weight:850;letter-spacing:.15em;text-transform:uppercase}.hero h1{font-size:34px;line-height:.95;margin:7px 0;text-transform:uppercase;letter-spacing:-.04em}.hero p{margin:0;color:var(--mu)}.tools{position:sticky;top:61px;z-index:15;padding:10px 14px;background:#090909e8;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff13}.search{width:100%;height:46px;border:1px solid var(--ln);border-radius:12px;background:#111;color:#fff;padding:0 14px;outline:none}.search:focus{border-color:var(--r);box-shadow:0 0 0 3px #e600122c}.chips{display:flex;gap:8px;overflow:auto;padding:10px 14px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--ln);background:var(--p);border-radius:999px;padding:9px 12px;font-weight:800}.chip.active{background:#fff;color:#080808;border-color:#fff}.panel{margin:0 12px 18px;border:1px solid var(--ln);border-radius:16px;background:#141414ee;overflow:hidden;box-shadow:0 18px 55px #0008}.panel-head{position:sticky;top:117px;z-index:10;display:flex;align-items:center;gap:8px;padding:11px 12px;background:#171717f5;border-bottom:1px solid var(--ln)}.panel-head div{min-width:0;margin-right:auto}.panel-head strong,.panel-head span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.panel-head span{font-size:12px;color:var(--mu)}.mini{border:1px solid var(--ln);border-radius:9px;background:#0d0d0d;padding:8px 10px;font-weight:750}.content{padding:16px 14px 36px}.content h1{font-size:28px;line-height:1;margin:3px 0 18px;text-transform:uppercase;letter-spacing:-.03em}.content h2{margin:28px 0 12px;padding:9px 11px;background:#fff;color:#090909;border-left:7px solid var(--r);font-size:19px;transform:skew(-1deg)}.content h3{margin:22px 0 10px}.content p{color:#ddd7ce}.line{margin:6px 0;padding:10px 11px 10px 29px;border:1px solid #343434;border-radius:10px;background:#101010;position:relative}.line:before{content:"◆";position:absolute;left:10px;top:11px;color:var(--r);font-size:9px}.line.sub{margin-left:18px;background:#191919}.line.best{border-color:#6b5818;background:#ffd24a12}.rank{margin:10px 0;border:1px solid #3d3d3d;border-radius:12px;overflow:hidden;background:#101010}.rank summary{list-style:none;padding:13px 14px;font-size:17px;font-weight:900;background:#202020}.rank summary::-webkit-details-marker{display:none}.rank summary:before{content:"+";display:inline-grid;place-items:center;width:23px;height:23px;margin-right:9px;background:var(--r);border-radius:5px}.rank[open] summary:before{content:"–"}.rank-body{padding:9px 12px 14px}.note{padding:12px;border:1px solid #6b5818;border-radius:10px;background:#ffd24a11;color:#f3df9c}.loading{text-align:center;color:var(--mu);padding:70px 12px}.spin{width:38px;height:38px;margin:0 auto 12px;border:4px solid #333;border-top-color:var(--r);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{padding:14px;border:1px solid #772832;border-radius:10px;background:#e6001215}.hidden{display:none!important}mark{background:var(--g);color:#000;border-radius:3px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 12px calc(9px + var(--safe-b));background:#090909f2;backdrop-filter:blur(18px);border-top:1px solid #ffffff20}.nav{height:52px;border:1px solid var(--ln);border-radius:13px;background:#171717;font-weight:900}.nav.active{background:var(--r);border-color:var(--r)}.status{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--mu);margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;background:#777}.dot.live{background:#52d687}.dot.cache{background:#ffd24a}.dot.err{background:var(--r)}@media(min-width:760px){body{max-width:760px;margin:auto;border-left:1px solid #222;border-right:1px solid #222}.bottom{left:50%;right:auto;width:760px;transform:translateX(-50%)}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">P5R</div><div><strong>P5R Pocket Guide</strong><small>Mobile online edition</small></div></div></header>
<section class="hero"><small>Persona 5 Royal</small><h1 id="heroTitle">Confidant Guide</h1><p id="heroText">Switch characters instantly and keep every rank within thumb reach.</p><div class="status"><i class="dot" id="dot"></i><span id="status">Ready</span></div></section>
<div class="tools"><input class="search" id="search" type="search" placeholder="Search character, Arcana, rank or answer…"></div>
<div class="chips" id="chips"></div>
<section class="panel"><div class="panel-head"><div><strong id="title">Select a guide</strong><span id="sub">RPG Site</span></div><button class="mini" id="source">Source ↗</button><button class="mini" id="reload">Reload</button></div><main class="content" id="content"><div class="loading"><div class="spin"></div>Preparing guide…</div></main></section>
<nav class="bottom"><button class="nav active" data-view="conf">♟ Confidants</button><button class="nav" data-view="class">✎ Class Answers</button></nav>
<script>
const RPG='https://www.rpgsite.net';
const conf=[
['Ann Takamaki','Lovers','9381-persona-5-royal-ann-confidant-guide-lovers-choices-romance-gifts'],['Ryuji Sakamoto','Chariot','5471-persona-5-royal-ryuji-confidant-guide-chariot-choices-unlocks'],['Makoto Niijima','Priestess','9378-persona-5-royal-makoto-confidant-guide-priestess-choices-romance-gifts'],['Yusuke Kitagawa','Emperor','9380-persona-5-yusuke-confidant-guide-emperor-choices-unlocks'],['Futaba Sakura','Hermit','9382-persona-5-royal-futaba-confidant-guide-hermit-choices-romance-gifts'],['Haru Okumura','Empress','9379-persona-5-royal-haru-confidant-guide-empress-choices-romance-gifts'],['Kasumi Yoshizawa','Faith','9599-persona-5-royal-kasumi-confidant-guide-faith-choices-romance-gifts'],['Goro Akechi','Justice','9601-persona-5-royal-akechi-confidant-guide-justice-choices-unlocks'],['Caroline & Justine','Strength','5486-persona-5-royal-strength-confidant-fusion-solutions-guide'],['Sadayo Kawakami','Temperance','5473-persona-5-royal-kawakami-confidant-guide-temperance-choices-romance-gifts'],['Tae Takemi','Death','9384-persona-5-royal-takemi-confidant-guide-death-choices-romance-gifts'],['Ichiko Ohya','Devil','9387-persona-5-royal-ohya-confidant-guide-devil-choices-romance-gifts'],['Shinya Oda','Tower','5475-persona-5-royal-oda-confidant-guide-tower-choices-unlock-list'],['Sojiro Sakura','Hierophant','5478-persona-5-royal-sojiro-confidant-guide-hierophant-choices'],['Hifumi Togo','Star','9388-persona-5-royal-hifumi-confidant-guide-star-choices-romance-unlock-gifts'],['Toranosuke Yoshida','Sun','5476-persona-5-royal-yoshida-confidant-guide-sun-link-choices-unlock'],['Chihaya Mifune','Fortune','5472-persona-5-royal-chihaya-confidant-guide-fortune-choices-romance'],['Munehisa Iwai','Hanged Man','9383-persona-5-royal-iwai-confidant-guide-hanged-man-choices-unlock-list'],['Yuuki Mishima','Moon','9385-persona-5-royal-mishima-confidant-guide-moon-choices-answers'],['Takuto Maruki','Councillor','9598-persona-5-royal-maruki-confidant-choices-guide-the-councillor'],['Igor, Morgana & Sae','Automatic','5469-persona-5-confidant-choices-unlocks-for-fool-magician-judgement-igor-morgana-sae']
].map((x,i)=>({id:i,name:x[0],arcana:x[1],url:RPG+'/feature/'+x[2]}));
const classUrl=RPG+'/feature/9602-persona-5-royal-exam-answers-class-test-solutions';
const months=['All','April','May','June','July','September','October','November','December','January'];
let state={view:'conf',item:conf[0],month:'All',url:conf[0].url,raw:''};
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
function inline(s){return esc(s).replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|\s)(\+3)(?=\s|$|[.,;:])/g,'$1<mark>$2</mark>')}
function clean(raw){let t=raw.replace(/\r/g,'');const m=t.indexOf('Markdown Content:');if(m>=0)t=t.slice(m+17);let a=t.split('\n'),s=a.findIndex(x=>/^#\s+Persona 5/i.test(x.trim()));if(s<0)s=a.findIndex(x=>/^#\s+/.test(x.trim()));if(s<0)s=0;let e=a.findIndex((x,i)=>i>s&&/^(Show comments|In this article|Copyright ©)/i.test(x.trim()));if(e<0)e=a.length;return a.slice(s,e).filter(x=>!/^Advertisement/i.test(x.trim())&&!/^!\[[^\]]*\]\([^)]*\)\s*$/.test(x.trim())).join('\n').trim()}
function render(md){let h='',open=false,n=0;const close=()=>{if(open){h+='</div></details>';open=false}};for(const raw of md.split('\n')){const l=raw.trimEnd(),t=l.trim();if(!t)continue;if(/^###\s+/.test(t)){close();h+=`<details class="rank searchable" ${n++===0?'open':''}><summary>${inline(t.replace(/^###\s+/,''))}</summary><div class="rank-body">`;open=true;continue}if(/^##\s+/.test(t)){close();h+=`<h2 class="searchable">${inline(t.replace(/^##\s+/,''))}</h2>`;continue}if(/^#\s+/.test(t)){close();h+=`<h1 class="searchable">${inline(t.replace(/^#\s+/,''))}</h1>`;continue}const b=l.match(/^(\s*)[-*]\s+(.*)$/);if(b){const sub=b[1].length>1?' sub':'';h+=`<div class="line searchable${sub}${/\+3/.test(b[2])?' best':''}">${inline(b[2])}</div>`;continue}h+=`<p class="searchable">${inline(t)}</p>`}close();return h}
function status(type,text){$('#dot').className='dot '+type;$('#status').textContent=text}
function proxy(url){return'https://r.jina.ai/http://'+url.replace(/^https?:\/\//,'')}
async function fetchGuide(url,force=false){const k='p5r-online:'+url;if(!force){try{const c=localStorage.getItem(k);if(c)return{t:c,mode:'cache'}}catch{}}const r=await fetch(proxy(url),{headers:{Accept:'text/plain'}});if(!r.ok)throw Error('Reader returned '+r.status);const t=clean(await r.text());if(t.length<300)throw Error('Source content was incomplete');try{localStorage.setItem(k,t)}catch{}return{t,mode:'live'}}
function renderChips(){const box=$('#chips');box.innerHTML='';const list=state.view==='conf'?conf:months.map((m,i)=>({id:i,name:m,arcana:'Class answers'}));list.forEach(x=>{const active=state.view==='conf'?x.id===state.item.id:x.name===state.month;const b=document.createElement('button');b.className='chip'+(active?' active':'');b.textContent=state.view==='conf'?x.name:x.name;b.onclick=()=>{if(state.view==='conf'){state.item=x;state.url=x.url;load(false)}else{state.month=x.name;state.url=classUrl;load(false)};renderChips();requestAnimationFrame(()=>b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}))};box.appendChild(b)})}
function monthSlice(md,m){if(m==='All')return md;const lines=md.split('\n'),re=new RegExp('^##\\s+'+m+'\\b','i');let s=lines.findIndex(x=>re.test(x.trim()));if(s<0)return md;let e=lines.findIndex((x,i)=>i>s&&/^##\s+/.test(x.trim()));if(e<0)e=lines.length;return'# '+m+' Class & Exam Answers\n'+lines.slice(s,e).join('\n')}
async function load(force){$('#content').innerHTML='<div class="loading"><div class="spin"></div>Loading and reorganizing RPG Site…</div>';status('','Loading');$('#title').textContent=state.view==='conf'?state.item.name:(state.month==='All'?'All Class Answers':state.month+' Answers');$('#sub').textContent=state.view==='conf'?state.item.arcana+' Arcana':'Chronological answer guide';try{const r=await fetchGuide(state.url,force);state.raw=r.t;$('#content').innerHTML=render(state.view==='class'?monthSlice(r.t,state.month):r.t);status(r.mode,r.mode==='live'?'Live RPG Site content':'Loaded from browser cache');filter($('#search').value)}catch(e){$('#content').innerHTML=`<div class="error"><strong>Could not load this guide.</strong><p>${esc(e.message)}</p><p>Tap Source to open RPG Site directly, then try Reload.</p></div>`;status('err','Source unavailable')}}
function filter(q){q=q.trim().toLowerCase();$$('.searchable').forEach(x=>x.classList.toggle('hidden',!!q&&!x.textContent.toLowerCase().includes(q)));$$('.rank').forEach(x=>{if(q&&x.textContent.toLowerCase().includes(q))x.open=true})}
function switchView(v){state.view=v;$$('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='conf'){$('#heroTitle').textContent='Confidant Guide';$('#heroText').textContent='Switch characters instantly and keep every rank within thumb reach.';state.url=state.item.url}else{$('#heroTitle').textContent='Class Answer Guide';$('#heroText').textContent='Jump by month and find class or exam answers quickly.';state.url=classUrl}renderChips();load(false)}
$$('.nav').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$('#source').onclick=()=>window.open(state.url,'_blank','noopener');$('#reload').onclick=()=>load(true);$('#search').oninput=e=>filter(e.target.value);renderChips();load(false);
</script>
</body>
</html>
